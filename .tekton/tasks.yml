apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the shared workspace before running tests.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-test
spec:
  description: Run Python unit tests using Nose.
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests-with-nose
      image: python:3.10
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir nose
        nosetests -v
